<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicación Efectiva en la Productividad Laboral</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0D1B2A; --blue: #1A56DB; --cyan: #06B6D4;
    --accent: #F59E0B; --red: #EF4444; --green: #10B981;
    --light: #F0F4FF; --mid: #CBD5E1; --white: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #0a0f18;
    color: var(--white);
    height: 100vh;
    width: 100vw;
  }

  .deck { width: 100%; height: 100vh; position: relative; }

  .slide {
    position: absolute;
    inset: 0;
    display: none;
    background: var(--navy);
    overflow-y: auto; /* Permite scroll si el contenido excede */
  }
  .slide.active { display: flex; flex-direction: column; animation: fadeIn .45s ease; }

  /* Ajustes Responsive */
  @media (max-width: 768px) {
    .slide-inner { padding: 20px !important; }
    .slide-body { flex-direction: column !important; gap: 20px !important; }
    .col.narrow { flex: 0 0 auto !important; width: 100% !important; }
    .cover-title { font-size: 40px !important; }
    .nav { width: 90% !important; }
  }

  .slide-inner { padding: 40px 60px; min-height: 100%; }

  .slide-header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .slide-num { font-family: 'Bebas Neue', sans-serif; font-size: 56px; color: var(--blue); opacity: .25; }
  .slide-body { flex: 1; display: flex; gap: 40px; }
  
  .col { flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .col.narrow { flex: 0 0 340px; }

  /* Mantener estilos originales de componentes... */
  .card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 20px; }
  .ops-table, .btable, .legend-table { width: 100%; border-collapse: collapse; }
  
  /* Asegurar que las tablas sean responsivas */
  .slide-body { overflow-x: hidden; }
  table { display: block; overflow-x: auto; }

  .nav {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px; z-index: 100;
    background: rgba(13,27,42,.85); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.1); border-radius: 40px; padding: 10px 20px;
  }
  /* ... resto de estilos originales ... */
</style>
</head>
<body>
<!-- Contenido original mantenido -->
<div class="deck" id="deck">
  <!-- Las diapositivas van aquí -->
</div>

<div class="nav" id="nav">
  <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">‹</button>
  <div class="nav-dots" id="dots"></div>
  <div class="nav-counter" id="counter">1 / 8</div>
  <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">›</button>
</div>

<script>
  // Script original de navegación
  const slides = document.querySelectorAll('.slide');
  let current = 0;
  function goTo(n) {
    slides[current].classList.remove('active');
    current = Math.max(0, Math.min(n, slides.length - 1));
    slides[current].classList.add('active');
    document.getElementById('counter').textContent = (current + 1) + ' / ' + slides.length;
  }
  function changeSlide(dir) { goTo(current + dir); }
  goTo(0);
</script>
</body>
</html>
